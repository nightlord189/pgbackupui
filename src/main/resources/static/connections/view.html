<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Connection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-database"></i> PG Backup UI
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/connections">Connections</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container-fluid py-4" id="app">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2><i class="bi bi-eye"></i> Connection Details</h2>
                    <div>
                        <a v-if="connection" :href="'/connections/edit?id=' + connection.id"
                           class="btn btn-primary">
                            <i class="bi bi-pencil"></i> Edit
                        </a>
                        <a href="/connections" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Back
                        </a>
                    </div>
                </div>

                <!-- Loading -->
                <div v-if="loading" class="text-center py-5">
                    <div class="spinner-border text-primary"></div>
                </div>

                <!-- Connection Details -->
                <div v-else-if="connection" class="card">
                    <div class="card-body">
                        <dl class="row">
                            <dt class="col-sm-3">Name</dt>
                            <dd class="col-sm-9">{{ connection.name }}</dd>

                            <dt class="col-sm-3">Type</dt>
                            <dd class="col-sm-9">{{ connection.type }}</dd>

                            <dt class="col-sm-3">Host</dt>
                            <dd class="col-sm-9">{{ connection.host }}</dd>

                            <dt class="col-sm-3">Port</dt>
                            <dd class="col-sm-9">{{ connection.port }}</dd>

                            <dt class="col-sm-3">Database</dt>
                            <dd class="col-sm-9">{{ connection.database }}</dd>

                            <dt class="col-sm-3">Username</dt>
                            <dd class="col-sm-9">{{ connection.username }}</dd>

                            <dt class="col-sm-3">Password</dt>
                            <dd class="col-sm-9">••••••••</dd>
                        </dl>
                    </div>
                </div>

                <!-- Error State -->
                <div v-else class="alert alert-danger">
                    Connection not found.
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.15/dist/vue.global.js"></script>
    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    connectionId: null,
                    connection: null,
                    loading: true
                };
            },
            async mounted() {
                const params = new URLSearchParams(window.location.search);
                this.connectionId = params.get('id');

                if (!this.connectionId) {
                    window.location.href = '/connections';
                    return;
                }

                await this.loadConnection();
            },
            methods: {
                async loadConnection() {
                    try {
                        const response = await fetch(`/api/connections/${this.connectionId}`);
                        if (response.ok) {
                            this.connection = await response.json();
                        }
                    } catch (error) {
                        console.error('Failed to load connection:', error);
                    } finally {
                        this.loading = false;
                    }
                }
            }
        }).mount('#app');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PG Backup UI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-database"></i> PG Backup UI
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/connections">Connections</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/storages">Storages</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/jobs">Jobs</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center">
                <h1 class="display-4 mb-4">
                    <i class="bi bi-database"></i> PG Backup UI
                </h1>
                <p class="lead mb-4">
                    Manage your PostgreSQL database backups with scheduled jobs and flexible storage options.
                </p>
                <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                    <a href="/connections" class="btn btn-primary btn-lg">
                        <i class="bi bi-plug"></i> Manage Connections
                    </a>
                    <a href="/storages" class="btn btn-primary btn-lg">
                        <i class="bi bi-hdd"></i> Manage Storages
                    </a>
                    <a href="/jobs" class="btn btn-primary btn-lg">
                        <i class="bi bi-calendar-check"></i> Manage Jobs
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Storage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-database"></i> PG Backup UI
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/connections">Connections</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/storages">Storages</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container-fluid py-4" id="app">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2><i class="bi bi-eye"></i> Storage Details</h2>
                    <div>
                        <a v-if="storage" :href="'/storages/edit?id=' + storage.id"
                           class="btn btn-primary">
                            <i class="bi bi-pencil"></i> Edit
                        </a>
                        <a href="/storages" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Back
                        </a>
                    </div>
                </div>

                <!-- Loading -->
                <div v-if="loading" class="text-center py-5">
                    <div class="spinner-border text-primary"></div>
                </div>

                <!-- Storage Details -->
                <div v-else-if="storage" class="card">
                    <div class="card-body">
                        <dl class="row">
                            <dt class="col-sm-3">Name</dt>
                            <dd class="col-sm-9">{{ storage.name }}</dd>

                            <dt class="col-sm-3">Type</dt>
                            <dd class="col-sm-9">
                                <span v-if="storage.type === 'LOCAL'" class="badge bg-secondary">
                                    <i class="bi bi-folder"></i> Local File System
                                </span>
                                <span v-else class="badge bg-info">
                                    <i class="bi bi-cloud"></i> Amazon S3
                                </span>
                            </dd>

                            <!-- LOCAL storage details -->
                            <template v-if="storage.type === 'LOCAL'">
                                <dt class="col-sm-3">Path</dt>
                                <dd class="col-sm-9"><code>{{ storage.path }}</code></dd>
                            </template>

                            <!-- S3 storage details -->
                            <template v-if="storage.type === 'S3'">
                                <dt class="col-sm-3">S3 Bucket</dt>
                                <dd class="col-sm-9">{{ storage.bucket }}</dd>

                                <dt class="col-sm-3">AWS Region</dt>
                                <dd class="col-sm-9">{{ storage.region }}</dd>

                                <dt class="col-sm-3">S3 Prefix/Path</dt>
                                <dd class="col-sm-9">
                                    <code v-if="storage.prefix">{{ storage.prefix }}</code>
                                    <span v-else class="text-muted">(root)</span>
                                </dd>

                                <dt class="col-sm-3">Access Key</dt>
                                <dd class="col-sm-9">{{ storage.accessKey }}</dd>

                                <dt class="col-sm-3">Secret Key</dt>
                                <dd class="col-sm-9">••••••••</dd>
                            </template>
                        </dl>
                    </div>
                </div>

                <!-- Error State -->
                <div v-else class="alert alert-danger">
                    Storage not found.
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.15/dist/vue.global.js"></script>
    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    storageId: null,
                    storage: null,
                    loading: true
                };
            },
            async mounted() {
                const params = new URLSearchParams(window.location.search);
                this.storageId = params.get('id');

                if (!this.storageId) {
                    window.location.href = '/storages';
                    return;
                }

                await this.loadStorage();
            },
            methods: {
                async loadStorage() {
                    try {
                        const response = await fetch(`/api/storages/${this.storageId}`);
                        if (response.ok) {
                            this.storage = await response.json();
                        }
                    } catch (error) {
                        console.error('Failed to load storage:', error);
                    } finally {
                        this.loading = false;
                    }
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
